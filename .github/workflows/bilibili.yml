# Auto Update Bilibili Fans

name: Bilibili Fans Auto Update

# BJT 03:55 -> 55 19; 23:50 -> 50 15
on:
  schedule:
    - cron: '50 15 * * *'

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests==2.34.2 numpy==2.5.4 pandas==3.1.0 matplotlib==3.11.2

    - name: Update bilibili
      run: |
        sh bilibili.sh
        sh draw.sh
      
    - name: Commit
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add .
        git commit --allow-empty -m "action:`date`"
        git pull --rebase
        
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
